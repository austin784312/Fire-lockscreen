name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME)

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/*.apk lockscreen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lockscreen-apk
          path: lockscreen.apk

      # Publishes the APK at a fixed public link:
      # https://github.com/<you>/<repo>/releases/latest/download/lockscreen.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" lockscreen.apk --title "Lock Screen $TAG" --notes "Built from ${{ github.sha }}" --latest

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.austin.lockscreen'
    compileSdk 34

    defaultConfig {
        applicationId 'com.austin.lockscreen'
        // 22 = Fire OS 5, so it installs on every Firestick that can sideload
        minSdk 22
        // Kept at 28 (Fire OS 7) so the older install rules apply
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without extra setup
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
